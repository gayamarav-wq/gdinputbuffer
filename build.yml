# Builds the .geode with the official Geode action (no local SDK needed).
# Push this folder to GitHub, open Actions -> "Build Geode Mod" -> Run workflow,
# then download the "Build Output" artifact: it contains the .geode file.
name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-geode-mod:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build-geode-mod"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
